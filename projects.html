<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blue Sail Solutions - Previous Projects and Case Studies">
    <title>Projects - Blue Sail Solutions</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .projects-page {
            margin-top: 70px;
            padding: 40px 0;
        }
        
        .project-detail {
            margin-bottom: 80px;
            padding: 40px 0;
            border-bottom: 2px solid var(--border-color);
        }
        
        .project-detail:last-child {
            border-bottom: none;
        }
        
        .project-header {
            margin-bottom: 2rem;
        }
        
        .project-category-badge {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }
        
        .project-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }
        
        .project-meta {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            color: var(--text-light);
            flex-wrap: wrap;
        }
        
        .project-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .project-meta-item strong {
            color: var(--text-dark);
        }
        
        .project-section {
            margin-bottom: 3rem;
        }
        
        .project-section h3 {
            font-size: 1.8rem;
            color: var(--text-dark);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary-color);
        }
        
        .project-section p {
            color: var(--text-light);
            line-height: 1.8;
            margin-bottom: 1rem;
        }
        
        .project-images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }
        
        .project-image-item {
            background-color: var(--bg-white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        
        .project-image-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .project-image-caption {
            padding: 1rem;
            color: var(--text-light);
            font-size: 0.9rem;
            text-align: center;
        }
        
        .project-image-placeholder {
            width: 100%;
            height: 300px;
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            border: 2px dashed var(--border-color);
        }
        
        .key-metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }
        
        .metric-card {
            background-color: var(--bg-white);
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: var(--shadow-md);
            text-align: center;
            border-top: 4px solid var(--primary-color);
        }
        
        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        
        .metric-label {
            font-size: 1rem;
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .metric-description {
            font-size: 0.9rem;
            color: var(--text-light);
        }
        
        .technologies-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .technology-tag {
            background-color: var(--bg-light);
            color: var(--text-dark);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
        }
        
        .results-list {
            list-style: none;
            padding-left: 0;
            margin: 1.5rem 0;
        }
        
        .results-list li {
            padding: 0.75rem 0;
            color: var(--text-dark);
            position: relative;
            padding-left: 2rem;
            font-size: 1.1rem;
        }
        
        .results-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--success-color);
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .project-title {
                font-size: 2rem;
            }
            
            .project-images-grid {
                grid-template-columns: 1fr;
            }
            
            .key-metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="nav-brand">
                <img src="BlueSailSolutions.png" alt="Blue Sail Solutions Logo" class="logo-img">
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html#home" class="nav-link">Home</a></li>
                <li><a href="index.html#services" class="nav-link">Services</a></li>
                <li><a href="projects.html" class="nav-link">Projects</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="index.html#contact" class="nav-link">Contact</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Projects Page Content -->
    <section class="projects-page">
        <div class="container">
            <a href="index.html#projects" class="back-link">← Back to Home</a>
            <h1 class="section-title">Previous Projects</h1>
            <p class="section-subtitle">Success stories from across industries</p>
            
            <div id="projectsContainer">
                <!-- Projects will be loaded here dynamically -->
                <p style="text-align: center; color: var(--text-light);">Loading projects...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <img src="BlueSailSolutions.png" alt="Blue Sail Solutions Logo" class="footer-logo">
                <div class="footer-text">
                    <p>&copy; 2024 Blue Sail Solutions. All rights reserved.</p>
                    <p class="footer-note">Operations Optimization & Data Analytics Consulting</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Load and display projects
        async function loadProjects() {
            try {
                const response = await fetch('projects-content.json');
                const data = await response.json();
                const container = document.getElementById('projectsContainer');
                
                if (!data.projects || data.projects.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-light);">No projects available yet.</p>';
                    return;
                }
                
                container.innerHTML = data.projects.map(project => `
                    <div class="project-detail" id="${project.id}">
                        <div class="project-header">
                            <span class="project-category-badge">${project.category}</span>
                            <h2 class="project-title">${project.title}</h2>
                            <div class="project-meta">
                                <div class="project-meta-item">
                                    <strong>Client:</strong> <span>${project.client}</span>
                                </div>
                                <div class="project-meta-item">
                                    <strong>Duration:</strong> <span>${project.duration}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="project-section">
                            <h3>Overview</h3>
                            <p>${project.overview}</p>
                        </div>
                        
                        <div class="project-section">
                            <h3>The Challenge</h3>
                            <p>${project.challenge}</p>
                        </div>
                        
                        <div class="project-section">
                            <h3>Our Solution</h3>
                            <p>${project.solution}</p>
                        </div>
                        
                        ${project.images && project.images.length > 0 ? `
                        <div class="project-section">
                            <h3>Project Visuals</h3>
                            <div class="project-images-grid">
                                ${project.images.map(img => `
                                    <div class="project-image-item">
                                        ${img.url && !img.url.includes('[placeholder]') ? 
                                            `<img src="${img.url}" alt="${img.alt}" onerror="this.parentElement.innerHTML='<div class=\\'project-image-placeholder\\'>Image: ${img.alt}<br><small>Place image at: ${img.url}</small></div>'">` :
                                            `<div class="project-image-placeholder">Image: ${img.alt}<br><small>Place image at: ${img.url}</small></div>`
                                        }
                                        <div class="project-image-caption">${img.caption}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}
                        
                        ${project.blockDiagrams && project.blockDiagrams.length > 0 ? `
                        <div class="project-section">
                            <h3>Block Diagrams</h3>
                            <div class="project-images-grid">
                                ${project.blockDiagrams.map(diagram => `
                                    <div class="project-image-item">
                                        ${diagram.url && !diagram.url.includes('[placeholder]') ? 
                                            `<img src="${diagram.url}" alt="${diagram.alt}" onerror="this.parentElement.innerHTML='<div class=\\'project-image-placeholder\\'>Block Diagram: ${diagram.title}<br><small>Place image at: ${diagram.url}</small></div>'">` :
                                            `<div class="project-image-placeholder">Block Diagram: ${diagram.title}<br><small>Place image at: ${diagram.url}</small></div>`
                                        }
                                        <div class="project-image-caption">
                                            <strong>${diagram.title}</strong><br>
                                            ${diagram.description}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}
                        
                        ${project.graphs && project.graphs.length > 0 ? `
                        <div class="project-section">
                            <h3>Results & Analytics</h3>
                            <div class="project-images-grid">
                                ${project.graphs.map(graph => `
                                    <div class="project-image-item">
                                        ${graph.url && !graph.url.includes('[placeholder]') ? 
                                            `<img src="${graph.url}" alt="${graph.alt}" onerror="this.parentElement.innerHTML='<div class=\\'project-image-placeholder\\'>Graph: ${graph.title}<br><small>Place image at: ${graph.url}</small></div>'">` :
                                            `<div class="project-image-placeholder">Graph: ${graph.title}<br><small>Place image at: ${graph.url}</small></div>`
                                        }
                                        <div class="project-image-caption">
                                            <strong>${graph.title}</strong><br>
                                            ${graph.description}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}
                        
                        ${project.keyMetrics && project.keyMetrics.length > 0 ? `
                        <div class="project-section">
                            <h3>Key Metrics</h3>
                            <div class="key-metrics-grid">
                                ${project.keyMetrics.map(metric => `
                                    <div class="metric-card">
                                        <div class="metric-value">${metric.value}</div>
                                        <div class="metric-label">${metric.metric}</div>
                                        <div class="metric-description">${metric.description}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}
                        
                        <div class="project-section">
                            <h3>Results</h3>
                            <ul class="results-list">
                                ${project.results.map(result => `<li>${result}</li>`).join('')}
                            </ul>
                        </div>
                        
                        ${project.technologies && project.technologies.length > 0 ? `
                        <div class="project-section">
                            <h3>Technologies Used</h3>
                            <div class="technologies-list">
                                ${project.technologies.map(tech => `<span class="technology-tag">${tech}</span>`).join('')}
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading projects:', error);
                document.getElementById('projectsContainer').innerHTML = 
                    '<p style="text-align: center; color: var(--text-light);">Error loading projects. Please check the projects-content.json file.</p>';
            }
        }
        
        // Load projects when page loads
        document.addEventListener('DOMContentLoaded', () => {
            loadProjects().then(() => {
                // Scroll to specific project if hash is present
                const hash = window.location.hash;
                if (hash) {
                    setTimeout(() => {
                        const element = document.querySelector(hash);
                        if (element) {
                            const offsetTop = element.offsetTop - 100;
                            window.scrollTo({
                                top: offsetTop,
                                behavior: 'smooth'
                            });
                        }
                    }, 500);
                }
            });
        });
    </script>
</body>
</html>
